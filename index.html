  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;ice-friction-detail&quot; role=&quot;region&quot; aria-label=&quot;冰与金属摩擦实验装置三维结构演示&quot;&gt;
  &lt;style&gt;
    #ice-friction-detail { position: relative; color: var(--foreground); font-family: system-ui, &quot;Microsoft YaHei&quot;, sans-serif; }
    #ice-friction-detail .viz-controls { margin-bottom: 8px; }
    #ice-friction-detail .stage { position: relative; width: 100%; height: 590px; overflow: hidden; border-radius: 10px; background: radial-gradient(circle at 48% 28%, #eef8ff 0%, #cbdce8 55%, #8ba1b1 100%); }
    #ice-friction-detail canvas { display: block; width: 100%; height: 100%; }
    #ice-friction-detail .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #ice-friction-detail .part-label { position: absolute; transform: translate(-50%, -50%); padding: 3px 7px; border: 1px solid rgba(33, 58, 76, .28); border-radius: 5px; background: rgba(255,255,255,.90); color: #17344a; font-size: 11px; font-weight: 650; line-height: 1.15; white-space: nowrap; box-shadow: 0 1px 5px rgba(20,42,58,.12); }
    #ice-friction-detail .part-label::before { content: &quot;&quot;; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--label-color, #2d7db7); vertical-align: 1px; }
    #ice-friction-detail .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 7px; color: var(--muted-foreground); font-size: 12px; }
    #ice-friction-detail .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 2px; vertical-align: -1px; }
    #ice-friction-detail .status { margin-top: 6px; color: var(--muted-foreground); font-size: 12px; }
    @media (max-width: 760px) { #ice-friction-detail .stage { height: 500px; } #ice-friction-detail .part-label { font-size: 10px; } }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;三维演示控制&quot;&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;ifd-play&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;暂停运动&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;ifd-explode&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;制冷层爆炸图&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;ifd-cut&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;剖开前壁&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;ifd-labels&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;隐藏标注&lt;/button&gt;
    &lt;button class=&quot;btn btn-ghost&quot; id=&quot;ifd-reset&quot; type=&quot;button&quot;&gt;复位视角&lt;/button&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ifd-material&quot;&gt;金属试样
      &lt;select class=&quot;form-select&quot; id=&quot;ifd-material&quot;&gt;
        &lt;option value=&quot;steel&quot;&gt;钢&lt;/option&gt;
        &lt;option value=&quot;aluminum&quot;&gt;铝&lt;/option&gt;
        &lt;option value=&quot;copper&quot;&gt;铜&lt;/option&gt;
        &lt;option value=&quot;brass&quot;&gt;黄铜&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ifd-explosion&quot;&gt;分解程度 &lt;output id=&quot;ifd-explosion-value&quot;&gt;0%&lt;/output&gt;&lt;/label&gt;
    &lt;input class=&quot;form-range&quot; id=&quot;ifd-explosion&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot; /&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stage&quot;&gt;
    &lt;canvas id=&quot;ifd-canvas&quot; aria-label=&quot;可旋转的开放式保温槽、冰面、金属滑块、TEC、散热片、风扇和ESP32控制系统三维模型&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;labels&quot; id=&quot;ifd-label-layer&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;legend&quot; aria-label=&quot;材料图例&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:#d7edf5&quot;&gt;&lt;/i&gt;XPS保温槽（顶部开放）&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:#b9dff2&quot;&gt;&lt;/i&gt;冰面&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:#f7f7f4;border:1px solid #bbb&quot;&gt;&lt;/i&gt;TEC1-12706 × 4&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:#aeb8c1&quot;&gt;&lt;/i&gt;铝合金托盘/散热片&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:#263746&quot;&gt;&lt;/i&gt;风扇/机械支架&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:#1f69ad&quot;&gt;&lt;/i&gt;ESP32与控制模块&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;status&quot; id=&quot;ifd-status&quot;&gt;装配视图｜金属滑块在开放冰面上做水平匀速往复运动&lt;/div&gt;

  &lt;script type=&quot;importmap&quot;&gt;
    { &quot;imports&quot;: { &quot;three&quot;: &quot;https://unpkg.com/three@0.161.0/build/three.module.js&quot; } }
  &lt;/script&gt;
  &lt;script type=&quot;module&quot;&gt;
    import * as THREE from &#x27;https://unpkg.com/three@0.161.0/build/three.module.js&#x27;;
    import { OrbitControls } from &#x27;https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js&#x27;;

    const root = document.getElementById(&#x27;ice-friction-detail&#x27;);
    const canvas = document.getElementById(&#x27;ifd-canvas&#x27;);
    const labelLayer = document.getElementById(&#x27;ifd-label-layer&#x27;);
    const status = document.getElementById(&#x27;ifd-status&#x27;);
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xb6cad8, 27, 48);

    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
    camera.position.set(15.5, 11.5, 16.5);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.target.set(0.4, 2.45, 0);
    controls.minDistance = 9;
    controls.maxDistance = 35;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x4b6070, 2.25));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.6);
    keyLight.position.set(9, 16, 11);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -16;
    keyLight.shadow.camera.right = 16;
    keyLight.shadow.camera.top = 16;
    keyLight.shadow.camera.bottom = -16;
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x8ad5ff, 2.0);
    rimLight.position.set(-10, 8, -9);
    scene.add(rimLight);

    const machine = new THREE.Group();
    scene.add(machine);
    const explodeParts = [];
    const fans = [];
    const airflowArrows = [];
    const labels = [];

    const makeMat = (color, metalness = 0.05, roughness = 0.48, opacity = 1) =&gt; new THREE.MeshStandardMaterial({
      color, metalness, roughness, transparent: opacity &lt; 1, opacity, side: THREE.DoubleSide
    });
    const materials = {
      tabletop: makeMat(0x55778c, 0.05, 0.7),
      black: makeMat(0x17212a, 0.72, 0.3),
      rubber: makeMat(0x111519, 0.05, 0.92),
      aluminum: makeMat(0xb8c1c9, 0.82, 0.24),
      aluminumBright: makeMat(0xdbe2e7, 0.86, 0.18),
      foam: makeMat(0xd8edf4, 0.02, 0.78),
      foamEdge: makeMat(0x9fc7d7, 0.02, 0.66),
      window: makeMat(0x99d8f0, 0.05, 0.16, 0.25),
      ice: makeMat(0xb9e5f6, 0.05, 0.14, 0.72),
      frost: makeMat(0xeafaff, 0.0, 0.75, 0.82),
      ceramic: makeMat(0xf7f7f2, 0.02, 0.32),
      tecEdge: makeMat(0x67a7c9, 0.05, 0.35),
      copper: makeMat(0xb76533, 0.78, 0.22),
      brass: makeMat(0xc7952f, 0.72, 0.24),
      steel: makeMat(0x8f9aa4, 0.9, 0.2),
      red: makeMat(0xd63c32, 0.08, 0.38),
      wireBlack: makeMat(0x12171c, 0.45, 0.5),
      pcbBlue: makeMat(0x155e9d, 0.1, 0.42),
      pcbRed: makeMat(0xa91f2b, 0.1, 0.42),
      pcbGreen: makeMat(0x208b57, 0.1, 0.42),
      pcbBlack: makeMat(0x161b1f, 0.18, 0.38),
      relayBlue: makeMat(0x1767ac, 0.08, 0.4),
      goldPin: makeMat(0xd0a326, 0.72, 0.25),
      screen: new THREE.MeshStandardMaterial({ color: 0x071928, emissive: 0x20bde8, emissiveIntensity: 0.55, roughness: 0.25 })
    };

    function part(name, position, explode = [0, 0, 0]) {
      const group = new THREE.Group();
      group.name = name;
      group.position.set(...position);
      group.userData.base = group.position.clone();
      group.userData.explode = new THREE.Vector3(...explode);
      machine.add(group);
      explodeParts.push(group);
      return group;
    }

    function box(parent, size, position, material, options = {}) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
      mesh.position.set(...position);
      if (options.rotation) mesh.rotation.set(...options.rotation);
      mesh.castShadow = options.castShadow !== false;
      mesh.receiveShadow = options.receiveShadow !== false;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(parent, radius, length, position, material, axis = &#x27;y&#x27;, segments = 28) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, segments), material);
      mesh.position.set(...position);
      if (axis === &#x27;x&#x27;) mesh.rotation.z = Math.PI / 2;
      if (axis === &#x27;z&#x27;) mesh.rotation.x = Math.PI / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function tube(parent, points, radius, material) {
      const curve = new THREE.CatmullRomCurve3(points.map(p =&gt; new THREE.Vector3(...p)));
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 30, radius, 10, false), material);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function torus(parent, major, minor, position, material, rotation = [Math.PI / 2, 0, 0]) {
      const mesh = new THREE.Mesh(new THREE.TorusGeometry(major, minor, 12, 36), material);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addBolt(parent, x, y, z, material = materials.steel, axis = &#x27;y&#x27;) {
      cylinder(parent, 0.105, 0.13, [x, y, z], material, axis, 16);
      const slot = box(parent, [0.14, 0.025, 0.025], [x, y + (axis === &#x27;y&#x27; ? 0.07 : 0), z], materials.black, { castShadow: false });
      if (axis !== &#x27;y&#x27;) slot.visible = false;
    }

    function addTextPlate(parent, text, width, height, position, color = &#x27;#17344a&#x27;, background = &#x27;#f8fbfd&#x27;) {
      const c = document.createElement(&#x27;canvas&#x27;);
      c.width = 512; c.height = 160;
      const ctx = c.getContext(&#x27;2d&#x27;);
      ctx.fillStyle = background; ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = &#x27;#6f8798&#x27;; ctx.lineWidth = 8; ctx.strokeRect(4, 4, c.width - 8, c.height - 8);
      ctx.fillStyle = color; ctx.font = &#x27;bold 46px Microsoft YaHei, sans-serif&#x27;; ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.fillText(text, c.width / 2, c.height / 2);
      const texture = new THREE.CanvasTexture(c); texture.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide }));
      mesh.position.set(...position);
      parent.add(mesh);
      return mesh;
    }

    function makeFan(name, position, explode) {
      const group = part(name, position, explode);
      const frame = new THREE.Group();
      group.add(frame);
      box(frame, [2.45, 0.20, 0.22], [0, 0, -1.12], materials.black);
      box(frame, [2.45, 0.20, 0.22], [0, 0, 1.12], materials.black);
      box(frame, [0.22, 0.20, 2.02], [-1.12, 0, 0], materials.black);
      box(frame, [0.22, 0.20, 2.02], [1.12, 0, 0], materials.black);
      for (const x of [-1.02, 1.02]) for (const z of [-1.02, 1.02]) {
        torus(frame, 0.105, 0.04, [x, 0.11, z], materials.aluminumBright);
      }
      const rotor = new THREE.Group();
      rotor.position.y = 0.13;
      group.add(rotor);
      cylinder(rotor, 0.29, 0.24, [0, 0, 0], materials.black, &#x27;y&#x27;);
      for (let i = 0; i &lt; 7; i++) {
        const angle = i * Math.PI * 2 / 7;
        const blade = box(rotor, [0.34, 0.09, 0.92], [Math.cos(angle) * 0.52, 0, Math.sin(angle) * 0.52], materials.black);
        blade.rotation.y = -angle + 0.38;
        blade.scale.x = 0.55;
      }
      torus(group, 0.94, 0.055, [0, 0.22, 0], materials.aluminumBright);
      fans.push(rotor);
      return group;
    }

    function makeHeatsink(name, z, explode) {
      const group = part(name, [0, 1.62, z], explode);
      box(group, [7.8, 0.26, 2.32], [0, 0.72, 0], materials.aluminumBright);
      box(group, [7.8, 0.12, 2.32], [0, 0.52, 0], materials.aluminum);
      for (let zi = -1.02; zi &lt;= 1.02; zi += 0.17) {
        box(group, [7.65, 0.62, 0.055], [0, 0.18, zi], materials.aluminum);
      }
      for (const x of [-3.55, 3.55]) for (const zz of [-0.98, 0.98]) addBolt(group, x, 0.88, zz);
      return group;
    }

    function makeTec(x, z, index) {
      const group = part(`TEC${index}`, [x, 2.55, z], [x * 0.18, -0.18, z * 0.34]);
      box(group, [1.22, 0.08, 1.22], [0, 0.08, 0], materials.ceramic);
      box(group, [1.17, 0.15, 1.17], [0, -0.035, 0], materials.tecEdge);
      box(group, [1.22, 0.08, 1.22], [0, -0.15, 0], materials.ceramic);
      addTextPlate(group, &#x27;TEC1-12706&#x27;, 1.02, 0.25, [0, 0.126, 0.18], &#x27;#29485b&#x27;, &#x27;#f7f7f3&#x27;).rotation.x = -Math.PI / 2;
      tube(group, [[0.52, -0.05, 0.22], [0.88, -0.18, 0.45], [1.22, -0.25, 0.58]], 0.035, materials.red);
      tube(group, [[0.52, -0.05, -0.22], [0.88, -0.18, -0.45], [1.22, -0.25, -0.58]], 0.035, materials.wireBlack);
      return group;
    }

    function makePcb(parent, size, position, material, nameText) {
      const board = new THREE.Group(); board.position.set(...position); parent.add(board);
      box(board, [size[0], 0.10, size[1]], [0, 0, 0], material);
      for (const x of [-size[0] / 2 + 0.11, size[0] / 2 - 0.11]) for (const z of [-size[1] / 2 + 0.11, size[1] / 2 - 0.11]) torus(board, 0.065, 0.022, [x, 0.06, z], materials.goldPin);
      addTextPlate(board, nameText, Math.min(size[0] * 0.78, 1.35), 0.28, [0, 0.061, 0]).rotation.x = -Math.PI / 2;
      return board;
    }

    function airflowArrow(origin, direction, length, color) {
      const arrow = new THREE.ArrowHelper(new THREE.Vector3(...direction).normalize(), new THREE.Vector3(...origin), length, color, 0.22, 0.12);
      arrow.line.material.transparent = true;
      arrow.line.material.opacity = 0.64;
      arrow.cone.material.transparent = true;
      arrow.cone.material.opacity = 0.78;
      machine.add(arrow);
      airflowArrows.push(arrow);
      return arrow;
    }

    // Ground and a real black wire-rack base; all four legs touch the tabletop.
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(42, 30), materials.tabletop);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const rack = part(&#x27;落地网架底座&#x27;, [0, 0, 0], [0, 0, 0]);
    for (const x of [-5.1, 5.1]) for (const z of [-4.0, 4.0]) {
      box(rack, [0.26, 1.05, 0.26], [x, 0.52, z], materials.black);
      box(rack, [0.62, 0.13, 0.62], [x, 0.065, z], materials.rubber);
    }
    box(rack, [10.5, 0.22, 0.25], [0, 1.02, -4.0], materials.black);
    box(rack, [10.5, 0.22, 0.25], [0, 1.02, 4.0], materials.black);
    box(rack, [0.25, 0.22, 8.0], [-5.1, 1.02, 0], materials.black);
    box(rack, [0.25, 0.22, 8.0], [5.1, 1.02, 0], materials.black);
    for (let x = -4.75; x &lt;= 4.75; x += 0.48) box(rack, [0.055, 0.075, 7.7], [x, 1.06, 0], materials.black);
    for (let z = -3.65; z &lt;= 3.65; z += 0.48) box(rack, [10.1, 0.075, 0.055], [0, 1.07, z], materials.black);

    // Two fan + long extruded heatsink assemblies match the purchased prototype.
    const fanFront = makeFan(&#x27;90mm轴流风扇（前）&#x27;, [0, 1.23, -1.42], [0, -2.2, -0.45]);
    const fanBack = makeFan(&#x27;90mm轴流风扇（后）&#x27;, [0, 1.23, 1.42], [0, -2.2, 0.45]);
    const sinkFront = makeHeatsink(&#x27;铝散热器（前）&#x27;, -1.42, [0, -1.18, -0.5]);
    const sinkBack = makeHeatsink(&#x27;铝散热器（后）&#x27;, 1.42, [0, -1.18, 0.5]);

    // The fan deck is supported by four legs, leaving a full open intake plenum below.
    for (const z of [-1.42, 1.42]) for (const x of [-0.62, 0, 0.62]) {
      airflowArrow([x, 0.20, z], [0, 1, 0], 0.78, 0x39aee2);
    }
    for (const z of [-1.42, 1.42]) {
      airflowArrow([-3.72, 2.05, z], [-1, 0, 0], 1.08, 0xf07b36);
      airflowArrow([3.72, 2.05, z], [1, 0, 0], 1.08, 0xf07b36);
    }

    const tecs = [
